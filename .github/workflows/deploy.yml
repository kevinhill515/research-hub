name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Org default in Silvercrest grants GITHUB_TOKEN only read access; the
# gh-pages push needs write. Granting at the workflow level (rather than
# org-wide via Settings → Actions) is least-privilege.
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # npm ci instead of `rm -rf node_modules package-lock.json && npm install`
        # — deterministic, faster, atomic. The destructive prelude was
        # racing the esbuild postinstall on GitHub runners (ETXTBSY:
        # spawning the binary while npm was still writing it). The
        # Cloudflare workflow doesn't do the rm and never sees this.
        run: npm ci

      # No VITE_ANTHROPIC_KEY env — the app now reads the Anthropic
      # key from each user's localStorage (set via the in-app Settings
      # modal). Embedding it at build time would re-trigger secret
      # scanning and put the key back in the public bundle.
      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
